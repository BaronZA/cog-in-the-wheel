<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cog DM">
    <title>A Cog in the Wheel - DM Companion</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Text', serif; margin: 0; }
        .font-display { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
        @keyframes gear-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes gear-spin-reverse { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        .gear-a { animation: gear-spin 18s linear infinite; transform-origin: center; }
        .gear-b { animation: gear-spin-reverse 12s linear infinite; transform-origin: center; }
        .gear-c { animation: gear-spin 24s linear infinite; transform-origin: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SAVE_KEY = 'cog-dm-companion';
        const saveState = (state) => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {} };
        const loadState = () => { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; } };
        const clearState = () => { try { localStorage.removeItem(SAVE_KEY); } catch(e) {} };

        const Icon = ({ d }) => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d={d}/>
            </svg>
        );
        const ChevronDown = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>
        );
        const ChevronRight = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>
        );

        // ── Collapsible Section ───────────────────────────────────────────────
        const Section = ({ title, icon, color, children, defaultOpen }) => {
            const [open, setOpen] = useState(defaultOpen || false);
            const colors = {
                amber:  'border-amber-600/50 bg-amber-950/30',
                green:  'border-green-600/50 bg-green-950/30',
                blue:   'border-blue-600/50 bg-blue-950/30',
                purple: 'border-purple-600/50 bg-purple-950/30',
                slate:  'border-slate-500/50 bg-slate-800/30',
                red:    'border-red-600/50 bg-red-950/30',
                teal:   'border-teal-600/50 bg-teal-950/30',
                cyan:   'border-cyan-600/50 bg-cyan-950/30',
                indigo: 'border-indigo-600/50 bg-indigo-950/30',
            };
            const headerColors = {
                amber:  'text-amber-300',  green:  'text-green-300',
                blue:   'text-blue-300',   purple: 'text-purple-300',
                slate:  'text-slate-300',  red:    'text-red-300',
                teal:   'text-teal-300',   cyan:   'text-cyan-300',
                indigo: 'text-indigo-300',
            };
            return (
                <div className={`border-2 rounded-lg overflow-hidden ${colors[color] || colors.slate} mt-3`}>
                    <button onClick={() => setOpen(!open)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-white/5 transition-colors">
                        <span className={`font-semibold font-display text-sm uppercase tracking-wider flex items-center gap-2 ${headerColors[color] || headerColors.slate}`}>
                            {icon} {title}
                        </span>
                        {open ? <ChevronDown /> : <ChevronRight />}
                    </button>
                    {open && <div className="px-4 pb-4 pt-1">{children}</div>}
                </div>
            );
        };

        // ── Read-Aloud Block ──────────────────────────────────────────────────
        const ReadAloud = ({ texts }) => (
            <div className="space-y-3">
                {texts.map((block, i) => {
                    const isConditional = block.conditional;
                    return (
                        <div key={i}>
                            {block.label && (
                                <span className={`inline-block text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded-t mb-0 ${
                                    isConditional ? 'bg-orange-700/80 text-orange-100' : 'bg-cyan-800/80 text-cyan-100'
                                }`}>{block.label}</span>
                            )}
                            <div className={`p-4 rounded-r-lg rounded-bl-lg italic text-base leading-relaxed ${
                                isConditional
                                    ? 'bg-orange-900/40 border-l-4 border-orange-400 text-orange-100/90'
                                    : 'bg-cyan-950/40 border-l-4 border-cyan-500 text-cyan-100/90'
                            }`}>{block.text}</div>
                        </div>
                    );
                })}
            </div>
        );

        // ── NPC Collapsible Sub-section ───────────────────────────────────────
        const NPCSubSection = ({ title, color, children }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className={`border border-${color}-600/30 rounded-lg mt-3 overflow-hidden`}>
                    <button onClick={() => setOpen(!open)} className={`w-full px-3 py-2 flex items-center justify-between bg-${color}-950/30 hover:bg-${color}-950/50 transition-colors`}>
                        <span className={`text-${color}-300 text-xs font-bold uppercase tracking-wider`}>{title}</span>
                        {open ? <ChevronDown /> : <ChevronRight />}
                    </button>
                    {open && <div className="px-3 pb-3 pt-2">{children}</div>}
                </div>
            );
        };

        // ── NPC Card ──────────────────────────────────────────────────────────
        const NPCCard = ({ npc }) => (
            <div className="bg-green-950/40 border border-green-600/40 rounded-lg p-4 mb-3">
                <div className="flex justify-between items-start mb-2">
                    <h4 className="text-lg font-bold text-green-300 font-display">{npc.name}</h4>
                    {npc.race && <span className="text-green-400/70 text-xs uppercase tracking-wider">{npc.race}</span>}
                </div>
                {npc.appearance && <p className="text-green-100/80 text-sm mb-2">{npc.appearance}</p>}
                {npc.personality && <p className="text-green-100/70 text-sm mb-2">{npc.personality}</p>}
                {npc.quote && (
                    <div className="bg-green-900/40 border-l-4 border-green-400 p-3 rounded-r italic text-green-200 text-sm mt-2">"{npc.quote}"</div>
                )}
                {npc.attitudes && (
                    <NPCSubSection title="How They React to Players" color="green">
                        <div className="space-y-2">
                            {npc.attitudes.map((att, i) => (
                                <div key={i} className="flex gap-2 text-sm">
                                    <span className={`flex-shrink-0 px-2 py-0.5 rounded text-xs font-bold ${
                                        att.approach === 'Friendly' ? 'bg-green-800 text-green-200' :
                                        att.approach === 'Threatening' ? 'bg-red-800 text-red-200' :
                                        att.approach === 'Deceptive' ? 'bg-yellow-800 text-yellow-200' :
                                        att.approach === 'Respectful' ? 'bg-blue-800 text-blue-200' :
                                        att.approach === 'Urgent' ? 'bg-orange-800 text-orange-200' :
                                        'bg-slate-700 text-slate-200'
                                    }`}>{att.approach}</span>
                                    <span className="text-green-100/70">{att.reaction}</span>
                                </div>
                            ))}
                        </div>
                    </NPCSubSection>
                )}
                {npc.playerQuestions && (
                    <NPCSubSection title="What Players Will Ask" color="amber">
                        <div className="space-y-3">
                            {npc.playerQuestions.map((pq, i) => (
                                <div key={i} className="bg-amber-950/30 border border-amber-600/20 rounded-lg p-3">
                                    <p className="text-amber-300 text-sm font-semibold mb-1">"{pq.question}"</p>
                                    <div className="bg-green-950/40 border-l-4 border-green-400/60 p-2 rounded-r mb-1">
                                        <p className="text-green-200 text-sm italic">{pq.answer}</p>
                                    </div>
                                    {pq.dmNote && <p className="text-purple-300/70 text-xs mt-1">DM: {pq.dmNote}</p>}
                                </div>
                            ))}
                        </div>
                    </NPCSubSection>
                )}
                {npc.doNotReveal && (
                    <NPCSubSection title="Do NOT Reveal" color="red">
                        <ul className="space-y-1">
                            {npc.doNotReveal.map((item, i) => (
                                <li key={i} className="text-red-200/80 text-sm flex gap-2">
                                    <span className="text-red-400 flex-shrink-0">✗</span><span>{item}</span>
                                </li>
                            ))}
                        </ul>
                    </NPCSubSection>
                )}
            </div>
        );

        // ── Mechanic Item ─────────────────────────────────────────────────────
        const MechanicItem = ({ item }) => (
            <div className="bg-blue-950/40 border border-blue-600/30 rounded-lg p-3 mb-2">
                <h4 className="text-sm font-bold text-blue-300 mb-1">{item.title}</h4>
                <p className="text-blue-100/80 text-sm">{item.details}</p>
            </div>
        );

        // ── FAQ Item ──────────────────────────────────────────────────────────
        const FAQItem = ({ item }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="bg-slate-800/40 border border-slate-600/30 rounded-lg mb-2">
                    <button onClick={() => setOpen(!open)} className="w-full px-3 py-2 flex items-center justify-between text-left hover:bg-white/5">
                        <span className="text-slate-200 text-sm font-semibold">{item.q}</span>
                        {open ? <ChevronDown /> : <ChevronRight />}
                    </button>
                    {open && <p className="px-3 pb-3 text-slate-300/80 text-sm">{item.a}</p>}
                </div>
            );
        };

        // ── Player Choice Flow ────────────────────────────────────────────────
        const ChoiceFlow = ({ choices }) => (
            <div className="space-y-4">
                {choices.map((choice, i) => (
                    <div key={i}>
                        <h4 className="text-teal-200 font-semibold text-sm mb-2">{choice.situation}</h4>
                        <div className="space-y-2">
                            {choice.options.map((opt, j) => (
                                <div key={j} className="bg-teal-950/40 border border-teal-600/30 rounded-lg p-3 flex gap-3">
                                    <span className="flex-shrink-0 bg-teal-700/60 text-teal-100 text-xs font-bold px-2 py-1 rounded h-fit">{opt.option}</span>
                                    <span className="text-teal-100/80 text-sm">{opt.outcome}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>
        );

        // ── Initiative Tracker ────────────────────────────────────────────────
        const InitiativeTracker = ({ initiative, setInitiative }) => {
            const { entries, currentIndex, round, sorted } = initiative;

            const updateEntry = (id, field, value) => {
                setInitiative(prev => ({ ...prev, entries: prev.entries.map(e => e.id === id ? { ...e, [field]: value } : e) }));
            };
            const rollD20 = (id) => updateEntry(id, 'init', Math.floor(Math.random() * 20) + 1);
            const sortAndStart = () => {
                setInitiative(prev => ({ ...prev, entries: [...prev.entries].sort((a, b) => b.init - a.init), currentIndex: 0, round: 1, sorted: true }));
            };
            const nextTurn = () => {
                setInitiative(prev => {
                    const next = prev.currentIndex + 1;
                    return next >= prev.entries.length ? { ...prev, currentIndex: 0, round: prev.round + 1 } : { ...prev, currentIndex: next };
                });
            };
            const prevTurn = () => {
                setInitiative(prev => {
                    const next = prev.currentIndex - 1;
                    return next < 0 ? { ...prev, currentIndex: prev.entries.length - 1, round: Math.max(1, prev.round - 1) } : { ...prev, currentIndex: next };
                });
            };
            const resetInit = () => {
                setInitiative(prev => ({ ...prev, entries: prev.entries.map(e => ({ ...e, init: 0 })), currentIndex: -1, round: 0, sorted: false }));
            };

            return (
                <div className="bg-cyan-950/30 border border-cyan-600/40 rounded-lg p-4">
                    <h3 className="text-lg font-semibold text-cyan-300 mb-3 flex items-center gap-2 font-display">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M12 2v4m0 12v4m8.66-14.66l-2.83 2.83M6.17 17.83l-2.83 2.83M22 12h-4M6 12H2"/>
                        </svg>
                        Initiative Tracker
                        {sorted && <span className="text-xs bg-cyan-700/60 px-2 py-0.5 rounded ml-2">Round {round}</span>}
                    </h3>
                    <div className="space-y-1.5">
                        {entries.map((entry, idx) => {
                            const isCurrent = sorted && idx === currentIndex;
                            const bgColor = entry.isPlayer ? 'bg-blue-950/40 border-blue-600/30' : entry.isNPC ? 'bg-green-950/40 border-green-600/30' : 'bg-red-950/40 border-red-600/30';
                            const textColor = entry.isPlayer ? 'text-blue-200' : entry.isNPC ? 'text-green-200' : 'text-red-200';
                            return (
                                <div key={entry.id} className={`flex items-center gap-2 p-2 rounded border ${bgColor} ${isCurrent ? 'ring-2 ring-cyan-400 bg-cyan-950/40' : ''}`}>
                                    {sorted && isCurrent && <span className="text-cyan-400 text-sm flex-shrink-0">▶</span>}
                                    <span className={`${textColor} text-sm font-semibold flex-1 truncate ${sorted && !isCurrent ? 'ml-5' : ''}`}>{entry.name}</span>
                                    {!sorted ? (
                                        <React.Fragment>
                                            <input type="number" value={entry.init || ''} onChange={e => updateEntry(entry.id, 'init', parseInt(e.target.value) || 0)}
                                                className="w-14 px-2 py-1 bg-slate-900 border border-cyan-600/30 rounded text-cyan-100 text-sm text-center" placeholder="0"/>
                                            <button onClick={() => rollD20(entry.id)} className="bg-cyan-700/60 hover:bg-cyan-600/60 px-2 py-1 rounded text-xs text-cyan-100">d20</button>
                                        </React.Fragment>
                                    ) : (
                                        <span className="text-cyan-300 text-sm font-bold w-8 text-center">{entry.init}</span>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex gap-2 mt-3">
                        {!sorted ? (
                            <button onClick={sortAndStart} className="flex-1 bg-cyan-700/60 hover:bg-cyan-600/60 py-2 rounded text-sm font-semibold text-cyan-100 transition-colors">Sort & Start</button>
                        ) : (
                            <React.Fragment>
                                <button onClick={prevTurn} className="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm text-slate-200">Prev</button>
                                <button onClick={nextTurn} className="flex-1 bg-cyan-700/60 hover:bg-cyan-600/60 py-2 rounded text-sm font-semibold text-cyan-100 transition-colors">Next Turn</button>
                            </React.Fragment>
                        )}
                        <button onClick={resetInit} className="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm text-slate-200">Reset</button>
                    </div>
                </div>
            );
        };

        // ── Encounter Scaling ─────────────────────────────────────────────────
        // Optimised for 5 × Level 2 characters.
        const ENCOUNTER_SCALING = {
            tierFor: (n) => n <= 2 ? 'Very Weak' : n <= 4 ? 'Weak' : n === 5 ? 'Average' : n <= 7 ? 'Strong' : 'Very Strong',
            tierStyle: {
                'Very Weak':   { bg: 'bg-red-900/50',     border: 'border-red-500/50',     text: 'text-red-300' },
                'Weak':        { bg: 'bg-orange-900/50',  border: 'border-orange-500/50',  text: 'text-orange-300' },
                'Average':     { bg: 'bg-yellow-900/50',  border: 'border-yellow-500/50',  text: 'text-yellow-300' },
                'Strong':      { bg: 'bg-green-900/50',   border: 'border-green-500/50',   text: 'text-green-300' },
                'Very Strong': { bg: 'bg-emerald-900/50', border: 'border-emerald-500/50', text: 'text-emerald-300' },
            },
            encounters: [
                // Encounters will be added as slides are built.
            ]
        };

        // ── Campaign Data ─────────────────────────────────────────────────────
        const CAMPAIGN_DATA = {
            slides: [
                {
                    id: 'intro',
                    title: 'Session Start',
                    type: 'intro',
                    description: "Forty-eight hours after the events at the lighthouse. The portal has closed. The severed arm is the only evidence. And Captain Eledstra needs you to walk through it when it reopens.",
                    readAloud: [
                        {
                            label: "Captain Eledstra's Briefing",
                            text: "An older woman tugs uncomfortably at a new captain's uniform as you enter. She welcomes you by name, then continues. \"To make a very long story short, Melvaunt has a potential problem,\" she sighs, running her fingers through her unruly short gray hair. \"There is a magical doorway in the city. The experts are calling it an asynchronous intermittent interdimensional portal. I guess that means a magical door to other worlds that is sometimes there and sometimes isn't. I call it a probable end to my career and a certain threat to the city.\""
                        },
                        {
                            label: "The Assignment",
                            text: "She pushes the modron's severed arm across the desk toward you with two fingers, like she'd rather not touch it. \"The sage I consulted tells me the portal will open again — briefly — in a few hours. Long enough for a small group to step through. What's on the other side I cannot say. What I can say is that whatever sent that thing into my city is still out there, and the Council of Lords is watching my every move. I need people I trust on the other side of that door. I need eyes.\" She looks at each of you in turn. \"You stopped it once. I'm asking you to finish it.\""
                        },
                        {
                            label: "Law of Averages (Optional Rule — Mechanus)",
                            text: "Note to DM: The DMG includes an optional rule for Mechanus — creatures on the plane of perfect law always use average damage for attacks and spells, never rolling. You may apply this to monsters throughout the adventure to reinforce the alien, mechanical feel of the plane. You are NOT required to apply it to the players.",
                            conditional: true
                        }
                    ],
                    roleplay: [
                        {
                            name: 'Captain LeCampe Eledstra',
                            race: 'Human, City Watch',
                            appearance: 'Mid-50s, short grey hair, new captain\'s uniform she keeps tugging at. Permanent look of someone who has seen too much and slept too little. The promotion was not her idea.',
                            personality: 'Pragmatic, direct, loyal to the city above the institution. Uncomfortable with politics. Deeply competent. She promoted not because she wanted it but because Superintendent Lahn Joden needed someone trustworthy in charge of this mess.',
                            quote: "I call it a probable end to my career and a certain threat to the city.",
                            attitudes: [
                                { approach: 'Respectful', reaction: 'Responds well. Gives more detail, more trust. Treats the party as professionals.' },
                                { approach: 'Friendly', reaction: 'Appreciates it but keeps it business. "We can catch up later. Right now, the clock is ticking."' },
                                { approach: 'Urgent', reaction: 'Matches your energy. Gets straight to the point, skips pleasantries entirely.' },
                                { approach: 'Threatening', reaction: '"You\'re welcome to find another Captain to brief you. The door is there." Cold. She means it.' },
                                { approach: 'Deceptive', reaction: 'She\'s a veteran detective. She notices. Doesn\'t call it out immediately — files it away.' },
                            ],
                            playerQuestions: [
                                {
                                    question: "What happened to the arm?",
                                    answer: '"The sage has it. He says it resonates with the portal frequency. We believe it can help us locate or stabilise the opening."',
                                    dmNote: 'The severed arm is key evidence and will be relevant in the adventure. Encourage players to keep it.'
                                },
                                {
                                    question: "What's on the other side of the portal?",
                                    answer: '"If I knew that, I\'d send soldiers. I\'m sending you because I need people who can think, not just fight. The sage believes it connects to a plane called Mechanus — a realm of pure law and order. Ironic, given the chaos we\'ve been dealing with."',
                                    dmNote: 'Mechanus is the plane of absolute law — enormous interlocking brass gears, modron hierarchy, perfect order. It is not typically dangerous unless you make it dangerous.'
                                },
                                {
                                    question: "What do you want us to find?",
                                    answer: '"Find the assassin. Find out who sent it. Find out what they want with Melvaunt. And if you can stop whatever is coming — do that too. In that order."'
                                },
                                {
                                    question: "What happened to Drake? / What about our injured companion?",
                                    answer: '"He\'s at the Watch infirmary. Boltac and the gnome priestess — Ellywicket — are both accounted for. Your friend is alive and stable. He\'ll be here when you get back."',
                                    dmNote: 'If Drake (or another absent player) rejoins, they caught up after recovering. Work them back in naturally.'
                                },
                                {
                                    question: "Are you coming with us?",
                                    answer: '"I have a city to run and a Superintendent asking me questions every four hours. I\'ll be right here when you step back through." A pause. "Come back through."',
                                },
                            ],
                            doNotReveal: [
                                'The modron army is already in Mechanus planning a full invasion of Melvaunt.',
                                'The portal will only stay open long enough for them to enter — there is no guaranteed return window.',
                                'The Superintendent is pressuring Eledstra to close the portal permanently, which would strand anyone inside.',
                            ]
                        },
                        {
                            name: 'C1e7i5 ("Cletis")',
                            race: 'Rogue Quadrone Modron — the assassin',
                            appearance: 'Cube-shaped body, bipedal, thin metallic limbs. Wears a hooded cloak. Can fly. Was last seen escaping through the portal sans one arm.',
                            personality: 'Chaos-soaked but still bound to modron logic. Its plan: lure armed pursuers through the portal to spark a war between Melvaunt and the modron army on the other side. It does not act randomly. It is always executing a plan.',
                            quote: 'Very well.',
                            doNotReveal: [
                                'C1e7i5 is still alive and on the other side of the portal.',
                                'The modron army compound is nearby in Mechanus — this is the real threat.',
                                'C1e7i5 may attempt to use the characters as pawns to escalate the conflict further.',
                            ]
                        }
                    ],
                    mechanics: [
                        { title: 'Adventure Code', details: 'CORE 1-2 — A Cog in the Wheel. Part Two of The Chaos in Melvaunt Trilogy. Designer: Pieter Sleijpen.' },
                        { title: 'Party Level', details: 'Characters should be Level 2 entering this adventure. Optimised for five 2nd-level characters.' },
                        { title: 'Party Strength (6 players, Level 2)', details: '6-7 characters at APL equivalent = STRONG party. Use Strong tier adjustments for all encounters.' },
                        { title: 'Adventure Duration', details: 'Four hours. Five distinct parts across two planes: Melvaunt and Mechanus.' },
                        { title: 'The Portal', details: 'An asynchronous intermittent interdimensional portal. Opens briefly — long enough to enter. The return window is not guaranteed. This should feel like a one-way door until they find another way back.' },
                        { title: 'Mechanus: Law of Averages (Optional)', details: 'The DMG optional rule for Mechanus: all creatures use average damage, never rolling dice. Apply to monsters throughout to reinforce the mechanical, ordered nature of the plane. Do not require players to use it unless everyone agrees it enhances the game.' },
                        { title: 'Key Theme', details: 'Order vs chaos. The modrons represent absolute law — corrupted by chaos energy, they have become paradoxically dangerous. The characters are a wild variable in a very ordered machine.' },
                    ],
                    dmTips: [
                        'Collect character info: name, level, race, class, passive Perception. Note any faction memberships — renown rewards apply at the end.',
                        'Players who ran CORE 1-1 get a natural hook. New players are recruited by faction contacts or approached by friends who heard about the Watch investigation.',
                        'Eledstra\'s promotion is genuine — but she is uncomfortable with the politics. Play her as someone who got a bigger chair and a bigger problem simultaneously.',
                        'The portal location: it opened in the lighthouse. Eledstra has the location staked out and warded by Watch officers. The party must go to the lighthouse when ready.',
                        'Mechanus is visually striking: enormous interlocking brass and iron gears, each the size of a continent, turning slowly in the void. Perfect geometric order. It should feel alien — beautiful and unsettling at once.',
                        'The Law of Averages rule is a flavour enhancement, not a mechanical requirement. Use it if it makes the game more interesting, not just harder.',
                        'Five 2nd-level characters = Average party. Six = Strong. If all six are present, use Strong tier throughout. If four are present, use Weak.',
                    ],
                    faq: [
                        { q: "Do we need to have played CORE 1-1?", a: "Strongly recommended but not required. New characters are recruited fresh. If mixing veterans and newcomers, have veterans give a quick out-of-character summary — or use the Session 1 recap from the previous DM Companion." },
                        { q: "What if the players used up all their resources in CORE 1-1?", a: "48 hours have passed. Characters have had two long rests. They are fully recovered. Boltac may also offer the use of his smithy for any repairs or preparation." },
                        { q: "Can we take a short rest before entering the portal?", a: "Yes — once briefed, they have time to prepare before the portal window. A short rest is reasonable." },
                        { q: "What if players refuse to enter the portal?", a: "Eledstra can't order them. She can appeal to their investment in the outcome — the threat to Melvaunt is real. If they still refuse, consider what faction pressure or personal stakes might motivate them." },
                        { q: "Where is the portal physically?", a: "The lighthouse at the end of the docks — same location as the CORE 1-1 finale. The Watch has it cordoned off." },
                    ]
                }
            ],
            parts: [
                { part: 'Briefing', location: 'Melvaunt', description: "Captain Eledstra's office. The portal window is approaching. Get your orders and prepare." },
                { part: 'Part 1 — Mechanus Arrival', location: 'Mechanus', description: 'Step through the portal into an active battle: modrons vs chaos slashers. Survive the fight and assess the situation.' },
                { part: 'Part 2 — Wilderness of Gears', location: 'Mechanus', description: 'Spot the modron army compound in the distance. Find two human mages observing the modrons — they have information.' },
                { part: 'Part 3 — The Compound', location: 'Mechanus', description: 'Infiltrate the modron camp. Find the invasion plans. Potentially confront C1e7i5. Trigger an alarm.' },
                { part: 'Part 4 — The Chase', location: 'Mechanus', description: 'Run. The modron army is mobilising. Get back to the portal before being overrun.' },
                { part: 'Part 5 — The Portal Fight', location: 'Mechanus → Melvaunt', description: 'A squad of modrons guard the portal. Alerted by C1e7i5, they will try to stop you leaving. Fight through or find another way.' },
            ]
        };

        // ── Main App ──────────────────────────────────────────────────────────
        const DMCompanion = () => {
            const saved = loadState();
            const [slide, setSlide] = useState(saved?.slide || 0);
            const [hp, setHp] = useState(saved?.hp || {});
            const [notes, setNotes] = useState(saved?.notes || { moments: [] });
            const [noteText, setNoteText] = useState('');
            const [showCombat, setShowCombat] = useState(false);
            const [initiative, setInitiative] = useState(saved?.initiative || { entries: [], currentIndex: -1, round: 0, sorted: false, slideId: null });
            const defaultPlayers = { Paladin: 'Caleb', Monk: 'Tav', Ranger: 'Gardak', Warlock: 'Drake', Sorcerer: 'Krisys', Barbarian: '' };
            const [players, setPlayers] = useState(saved?.players || defaultPlayers);
            const [absentClasses, setAbsentClasses] = useState(saved?.absentClasses || []);

            const current = CAMPAIGN_DATA.slides[slide];
            const activeCount = Object.keys(players).filter(cls => !absentClasses.includes(cls)).length;
            const currentTier = ENCOUNTER_SCALING.tierFor(activeCount);
            const effectiveEnemy = (enemy) => ({
                count: enemy.countByTier?.[currentTier] ?? enemy.count,
                hp: enemy.hpByTier?.[currentTier] ?? enemy.hp,
            });

            const toggleAbsent = (cls) => {
                setAbsentClasses(prev => prev.includes(cls) ? prev.filter(c => c !== cls) : [...prev, cls]);
            };

            useEffect(() => {
                saveState({ slide, hp, notes, initiative, players, absentClasses });
            }, [slide, hp, notes, initiative, players, absentClasses]);

            // Auto-populate initiative for combat/skill-challenge slides
            useEffect(() => {
                if (current.type === 'combat' || current.type === 'skill-challenge') {
                    setInitiative(prev => {
                        if (prev.slideId === current.id) return prev;
                        const entries = [];
                        const classes = ['Paladin', 'Monk', 'Ranger', 'Warlock', 'Sorcerer', 'Barbarian'].filter(cls => !absentClasses.includes(cls));
                        classes.forEach(cls => {
                            const displayName = players[cls] ? `${players[cls]} (${cls})` : cls;
                            entries.push({ id: `player-${cls}`, name: displayName, init: 0, isPlayer: true, isNPC: false });
                        });
                        current.npcs?.forEach(n => {
                            entries.push({ id: `npc-${n.name}`, name: n.name, init: 0, isPlayer: false, isNPC: true });
                        });
                        current.enemies?.forEach(e => {
                            const initVal = e.name === 'C1e7i5' ? 20 : 0;
                            const eff = effectiveEnemy(e);
                            if (eff.count === 1) {
                                entries.push({ id: `enemy-${e.name}`, name: e.name, init: initVal, isPlayer: false, isNPC: false });
                            } else {
                                entries.push({ id: `enemy-${e.name}-group`, name: `${e.name} (x${eff.count})`, init: initVal, isPlayer: false, isNPC: false });
                            }
                        });
                        return { entries, currentIndex: -1, round: 0, sorted: false, slideId: current.id };
                    });
                } else {
                    setInitiative({ entries: [], currentIndex: -1, round: 0, sorted: false, slideId: null });
                }
            }, [slide]);

            const updateHp = (key, delta, max) => {
                setHp(prev => ({ ...prev, [key]: Math.max(0, Math.min(max, (prev[key] || max) + delta)) }));
            };

            const addNote = () => {
                if (!noteText.trim()) return;
                setNotes(prev => ({ ...prev, moments: [...prev.moments, { time: new Date().toLocaleTimeString(), text: noteText }] }));
                setNoteText('');
            };

            const resetSession = () => {
                if (confirm('Reset all session data? This clears HP, notes, initiative, and slide position.')) {
                    clearState();
                    setSlide(0); setHp({}); setNotes({ moments: [] }); setNoteText('');
                    setShowCombat(false);
                    setInitiative({ entries: [], currentIndex: -1, round: 0, sorted: false, slideId: null });
                    setPlayers(defaultPlayers); setAbsentClasses([]);
                }
            };

            const renderSlideContent = () => {
                const sections = [];

                if (current.description) {
                    sections.push(
                        <p key="desc" className="text-cyan-100/80 text-base mb-2 leading-relaxed">{current.description}</p>
                    );
                }

                // ── Intro slide special panel ────────────────────────────────
                if (current.type === 'intro') {
                    sections.push(
                        <div key="intro-cards" className="grid md:grid-cols-2 gap-4 mb-2">
                            <div className="bg-slate-950/50 p-5 rounded-lg border border-cyan-600/30">
                                <h3 className="text-lg font-semibold text-cyan-400 mb-3 font-display">Party</h3>
                                <div className="grid grid-cols-2 gap-x-4 gap-y-2 mb-3">
                                    {Object.keys(players).map(cls => {
                                        const absent = absentClasses.includes(cls);
                                        return (
                                            <div key={cls} className={`flex items-center gap-1.5 ${absent ? 'opacity-40' : ''}`}>
                                                <button onClick={() => toggleAbsent(cls)} title={absent ? 'Mark as present' : 'Mark as absent'}
                                                    className={`flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center text-xs transition-colors ${
                                                        absent ? 'border-slate-600 bg-slate-800 text-slate-500' : 'border-cyan-500 bg-cyan-900/60 text-cyan-300'
                                                    }`}>
                                                    {absent ? '–' : '✓'}
                                                </button>
                                                <span className={`text-xs font-semibold w-16 shrink-0 ${absent ? 'text-slate-500' : 'text-cyan-400'}`}>{cls}</span>
                                                <input type="text" placeholder="Name" value={players[cls]}
                                                    onChange={e => setPlayers(prev => ({ ...prev, [cls]: e.target.value }))}
                                                    className="bg-slate-900/60 border border-cyan-600/30 rounded px-2 py-1 text-xs text-cyan-100 placeholder-cyan-100/30 w-full focus:outline-none focus:border-cyan-500/60"
                                                />
                                            </div>
                                        );
                                    })}
                                </div>
                                <p className="text-cyan-100/50 text-xs mb-3">✓ = present this session &nbsp;|&nbsp; – = absent</p>
                                <ul className="space-y-2 text-sm">
                                    <li className="text-cyan-100/90">Level 2 — Strong Party (6 players)</li>
                                    <li className="text-cyan-100/90">Duration: 4 hours</li>
                                    <li className="text-cyan-100/90">Location: Melvaunt → Mechanus</li>
                                </ul>
                            </div>
                            <div className="bg-slate-950/50 p-5 rounded-lg border border-indigo-600/30">
                                <h3 className="text-lg font-semibold text-indigo-400 mb-3 font-display">Objectives</h3>
                                <ul className="space-y-2 text-sm">
                                    <li className="text-indigo-100/90">Enter the portal to Mechanus</li>
                                    <li className="text-indigo-100/90">Hunt down the modron assassin C1e7i5</li>
                                    <li className="text-indigo-100/90">Discover the scope of the modron threat</li>
                                    <li className="text-indigo-100/90">Retrieve the invasion plans</li>
                                    <li className="text-indigo-100/90">Return through the portal alive</li>
                                </ul>
                            </div>
                        </div>
                    );
                }

                // ── Read-Aloud ───────────────────────────────────────────────
                if (current.readAloud?.length) {
                    sections.push(
                        <Section key="readAloud" title="Read Aloud" icon="📜" color="cyan" defaultOpen={true}>
                            <ReadAloud texts={current.readAloud} />
                        </Section>
                    );
                }

                // ── Player Choices ───────────────────────────────────────────
                if (current.choices?.length) {
                    sections.push(
                        <Section key="choices" title="Player Choices" icon="🔀" color="teal" defaultOpen={true}>
                            <ChoiceFlow choices={current.choices} />
                        </Section>
                    );
                }

                // ── NPC Roleplay ─────────────────────────────────────────────
                if (current.roleplay?.length) {
                    sections.push(
                        <Section key="roleplay" title="NPC Roleplay Guide" icon="🎭" color="green">
                            {current.roleplay.map((npc, i) => <NPCCard key={i} npc={npc} />)}
                        </Section>
                    );
                }

                // ── Mechanics ────────────────────────────────────────────────
                if (current.mechanics?.length) {
                    sections.push(
                        <Section key="mechanics" title="Key Mechanics & Setup" icon="⚙️" color="blue" defaultOpen={current.type === 'intro'}>
                            {current.mechanics.map((item, i) => <MechanicItem key={i} item={item} />)}
                        </Section>
                    );
                }

                // ── DM Tips ──────────────────────────────────────────────────
                if (current.dmTips?.length) {
                    sections.push(
                        <Section key="dmTips" title="DM Tips" icon="💡" color="purple">
                            <ul className="space-y-2">
                                {current.dmTips.map((tip, i) => (
                                    <li key={i} className="text-purple-100/80 text-sm flex gap-2">
                                        <span className="text-purple-400 mt-0.5 flex-shrink-0">▸</span>
                                        <span>{tip}</span>
                                    </li>
                                ))}
                            </ul>
                        </Section>
                    );
                }

                // ── FAQ ──────────────────────────────────────────────────────
                if (current.faq?.length) {
                    sections.push(
                        <Section key="faq" title="Common Questions" icon="❓" color="slate">
                            {current.faq.map((item, i) => <FAQItem key={i} item={item} />)}
                        </Section>
                    );
                }

                return sections;
            };

            // ── Combat Tracker ───────────────────────────────────────────────
            const renderCombatTracker = () => {
                if (current.type !== 'combat' && current.type !== 'skill-challenge') return null;
                return (
                    <div className="space-y-4 mb-4">
                        <button onClick={() => setShowCombat(!showCombat)}
                            className="w-full bg-red-900/50 hover:bg-red-900/70 p-4 rounded-lg border-2 border-red-600/60 text-red-200 font-semibold flex items-center justify-center gap-3 transition-all">
                            <Icon d="M14.5 17.5L3 6 3 3 6 3 17.5 14.5M13 19l6-6M16 16l4 4M19 21l2-2"/>
                            {showCombat ? 'Hide' : 'Show'} Combat Tracker
                        </button>
                        {showCombat && (
                            <div className="bg-slate-950/80 p-5 rounded-lg border-2 border-red-600/50 space-y-4">
                                {initiative.entries.length > 0 && <InitiativeTracker initiative={initiative} setInitiative={setInitiative} />}
                                {current.npcs && (
                                    <div>
                                        <h3 className="text-lg font-semibold text-green-400 mb-3">NPCs / Allies</h3>
                                        {current.npcs.map(npc => {
                                            const currentHp = hp[npc.name] || npc.hp;
                                            const pct = (currentHp / npc.hp) * 100;
                                            return (
                                                <div key={npc.name} className="bg-green-950/30 p-3 rounded border border-green-600/30 mb-2">
                                                    <div className="flex justify-between mb-2">
                                                        <span className="text-green-300 font-semibold">{npc.name}</span>
                                                        <span className="text-green-200 text-sm">AC {npc.ac}</span>
                                                    </div>
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <button onClick={() => updateHp(npc.name, -5, npc.hp)} className="bg-red-700 hover:bg-red-600 px-3 py-1 rounded text-xs font-semibold">-5</button>
                                                        <button onClick={() => updateHp(npc.name, -1, npc.hp)} className="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-xs font-semibold">-1</button>
                                                        <div className="flex-1 text-center">
                                                            <span className={`text-lg font-bold ${pct === 0 ? 'text-red-400' : pct <= 50 ? 'text-yellow-400' : 'text-green-400'}`}>{currentHp} / {npc.hp}</span>
                                                        </div>
                                                        <button onClick={() => updateHp(npc.name, 1, npc.hp)} className="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-semibold">+1</button>
                                                        <button onClick={() => updateHp(npc.name, 5, npc.hp)} className="bg-green-700 hover:bg-green-600 px-3 py-1 rounded text-xs font-semibold">+5</button>
                                                    </div>
                                                    <div className="w-full bg-slate-800 rounded-full h-2">
                                                        <div className={`h-2 rounded-full transition-all ${pct === 0 ? 'bg-red-600' : pct <= 50 ? 'bg-yellow-500' : 'bg-green-500'}`} style={{width: `${pct}%`}}/>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                                {current.enemies && (
                                    <div>
                                        <h3 className="text-lg font-semibold text-red-400 mb-3">Enemies</h3>
                                        {current.enemies.map(enemy => {
                                            const { count: effCount, hp: effHp } = effectiveEnemy(enemy);
                                            const creatures = Array.from({ length: effCount }, (_, i) => ({
                                                key: `${enemy.name}-${i+1}`,
                                                name: effCount > 1 ? `${enemy.name} #${i+1}` : enemy.name
                                            }));
                                            return (
                                                <div key={enemy.name} className="bg-red-950/30 p-3 rounded border border-red-600/50 mb-3">
                                                    <h4 className="text-red-300 font-semibold mb-2">{enemy.name}</h4>
                                                    <div className="grid grid-cols-2 gap-2 text-xs text-red-200/80 mb-2">
                                                        <span>AC: {enemy.ac}</span><span>HP: {effHp}</span>
                                                    </div>
                                                    {enemy.speed && <div className="text-xs text-red-200/60 mb-2">Speed: {enemy.speed}</div>}
                                                    {enemy.attacks?.map((atk, j) => (
                                                        <div key={j} className="text-xs text-red-100 bg-red-900/40 rounded px-2 py-1 mb-1 font-mono">⚔ {atk}</div>
                                                    ))}
                                                    {enemy.traits?.length > 0 && (
                                                        <div className="flex flex-wrap gap-1 mb-2">
                                                            {enemy.traits.map((t, j) => (
                                                                <span key={j} className="text-xs bg-red-900/30 text-red-300/70 rounded px-1.5 py-0.5 border border-red-700/30">{t}</span>
                                                            ))}
                                                        </div>
                                                    )}
                                                    {creatures.map(({ key, name }) => {
                                                        const currentHp = hp[key] !== undefined ? hp[key] : effHp;
                                                        const pct = (currentHp / effHp) * 100;
                                                        return (
                                                            <div key={key} className="bg-slate-950/50 p-2 rounded mb-2">
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <span className="text-red-200 text-sm flex-1">{name}</span>
                                                                    <button onClick={() => updateHp(key, -5, effHp)} className="bg-red-700 hover:bg-red-600 px-2 py-1 rounded text-xs">-5</button>
                                                                    <button onClick={() => updateHp(key, -1, effHp)} className="bg-red-600 hover:bg-red-500 px-2 py-1 rounded text-xs">-1</button>
                                                                    <span className={`font-bold text-sm w-16 text-center ${pct === 0 ? 'text-red-400 line-through' : pct <= 50 ? 'text-yellow-400' : 'text-red-200'}`}>{currentHp}/{effHp}</span>
                                                                    <button onClick={() => updateHp(key, 1, effHp)} className="bg-green-600 hover:bg-green-500 px-2 py-1 rounded text-xs">+1</button>
                                                                    <button onClick={() => updateHp(key, 5, effHp)} className="bg-green-700 hover:bg-green-600 px-2 py-1 rounded text-xs">+5</button>
                                                                </div>
                                                                <div className="w-full bg-slate-800 rounded-full h-1.5">
                                                                    <div className={`h-1.5 rounded-full transition-all ${pct === 0 ? 'bg-red-600' : pct <= 50 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{width: `${pct}%`}}/>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-slate-50">
                    {/* Subtle gear background pattern */}
                    <div className="fixed inset-0 opacity-[0.03] pointer-events-none overflow-hidden">
                        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <g className="gear-a" style={{transformOrigin:'20% 30%'}}>
                                <path fill="white" d="M120 100 l8-20 8 20zm-8-20 l-8-20 24 0zm24 0 l-8 20 8 20zm8 20 l8 20-24 0zm-24 0 l8-20-8-20z" transform="translate(180,200) scale(3)"/>
                            </g>
                            <g className="gear-b" style={{transformOrigin:'75% 65%'}}>
                                <path fill="white" d="M120 100 l8-20 8 20zm-8-20 l-8-20 24 0zm24 0 l-8 20 8 20zm8 20 l8 20-24 0zm-24 0 l8-20-8-20z" transform="translate(900,600) scale(5)"/>
                            </g>
                            <g className="gear-c" style={{transformOrigin:'50% 15%'}}>
                                <path fill="white" d="M120 100 l8-20 8 20zm-8-20 l-8-20 24 0zm24 0 l-8 20 8 20zm8 20 l8 20-24 0zm-24 0 l8-20-8-20z" transform="translate(600,50) scale(2)"/>
                            </g>
                        </svg>
                    </div>

                    {/* ── Header ──────────────────────────────────────────── */}
                    <header className="sticky top-0 z-50 border-b-2 border-cyan-600/80 bg-slate-950/90 backdrop-blur">
                        <div className="container mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-4xl font-bold text-cyan-300 font-display">A Cog in the Wheel</h1>
                                    <p className="text-cyan-400/60 text-sm mt-1">DM Companion &bull; CORE 1-2 &bull; Slide {slide+1} of {CAMPAIGN_DATA.slides.length}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => { setSlide(s => Math.max(0, s-1)); setShowCombat(false); }}
                                        disabled={slide === 0}
                                        className="px-3 py-2 bg-cyan-900/50 hover:bg-cyan-900/70 disabled:bg-slate-800/50 disabled:text-slate-600 rounded-lg border-2 border-cyan-600/50 disabled:border-slate-700 transition-all font-semibold flex items-center gap-1 text-sm"
                                    >
                                        <Icon d="m15 18-6-6 6-6"/> Prev
                                    </button>
                                    <button
                                        onClick={() => { setSlide(s => Math.min(CAMPAIGN_DATA.slides.length-1, s+1)); setShowCombat(false); }}
                                        disabled={slide === CAMPAIGN_DATA.slides.length-1}
                                        className="px-3 py-2 bg-cyan-900/50 hover:bg-cyan-900/70 disabled:bg-slate-800/50 disabled:text-slate-600 rounded-lg border-2 border-cyan-600/50 disabled:border-slate-700 transition-all font-semibold flex items-center gap-1 text-sm"
                                    >
                                        Next <Icon d="m9 18 6-6-6-6"/>
                                    </button>
                                    {current.time && (
                                        <div className="bg-indigo-900/60 px-4 py-2 rounded-lg border border-indigo-500/40 flex items-center gap-2">
                                            <span className="text-indigo-200 font-semibold">{current.time}</span>
                                        </div>
                                    )}
                                    <button onClick={resetSession}
                                        className="bg-slate-800/60 hover:bg-red-900/60 px-3 py-2 rounded-lg border border-slate-600/40 hover:border-red-500/40 text-slate-400 hover:text-red-300 text-xs transition-all"
                                        title="Reset all session data">
                                        New Session
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-6 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                            {/* ── Main Content ──────────────────────────── */}
                            <div className="lg:col-span-2">
                                {/* Coming Soon teaser banner — only on intro slide */}
                                {current.type === 'intro' && (
                                    <div className="mb-4 bg-gradient-to-r from-indigo-950/80 via-cyan-950/80 to-indigo-950/80 border-2 border-cyan-500/60 rounded-xl p-5 text-center relative overflow-hidden">
                                        <div className="absolute inset-0 opacity-10" style={{backgroundImage:"repeating-linear-gradient(45deg,#0891b2 0,#0891b2 1px,transparent 0,transparent 50%)", backgroundSize:"20px 20px"}}/>
                                        <p className="text-cyan-400/70 text-xs uppercase tracking-widest mb-1 font-display">The Chaos in Melvaunt — Part Two</p>
                                        <h2 className="text-3xl font-bold text-cyan-200 font-display mb-2">A Cog in the Wheel</h2>
                                        <p className="text-indigo-200/80 text-sm italic max-w-xl mx-auto">With the identity of a murderer confirmed, heroes are needed to track it down to its home. As it turns out, it might be a longer journey than first imagined.</p>
                                        <div className="mt-3 flex justify-center gap-4 text-xs text-cyan-400/60 uppercase tracking-wider">
                                            <span>CORE 1-2</span><span>·</span><span>Level 2</span><span>·</span><span>4 Hours</span><span>·</span><span>Melvaunt → Mechanus</span>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-gradient-to-r from-indigo-900/30 to-cyan-900/30 backdrop-blur border-2 border-cyan-600/40 rounded-xl p-6 shadow-2xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-3xl font-bold text-cyan-200 font-display">{current.title}</h2>
                                        <span className="px-3 py-1 bg-slate-950/60 rounded text-sm uppercase tracking-wider text-cyan-300/80 border border-cyan-600/30">{current.type}</span>
                                    </div>

                                    {renderCombatTracker()}
                                    {renderSlideContent()}
                                </div>
                            </div>

                            {/* ── Sidebar ───────────────────────────────── */}
                            <div className="space-y-6">

                                {/* Encounter Calculator */}
                                {(() => {
                                    const tier = ENCOUNTER_SCALING.tierFor(activeCount);
                                    const style = ENCOUNTER_SCALING.tierStyle[tier];
                                    const currentEnc = ENCOUNTER_SCALING.encounters.find(e => e.slideId === current.id);
                                    return (
                                        <div className="bg-slate-950/80 backdrop-blur border-2 border-cyan-600/40 rounded-lg p-4">
                                            <h3 className="text-lg font-bold text-cyan-300 mb-3 flex items-center gap-2 font-display">
                                                <Icon d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
                                                Encounter Calculator
                                            </h3>
                                            <div className={`${style.bg} border ${style.border} rounded-lg px-3 py-2 mb-3 flex items-center justify-between`}>
                                                <span className="text-cyan-200/70 text-sm">{activeCount} active player{activeCount !== 1 ? 's' : ''}</span>
                                                <span className={`${style.text} font-bold text-sm uppercase tracking-wider`}>{tier}</span>
                                            </div>
                                            {currentEnc ? (
                                                <div className="mb-3">
                                                    <p className="text-cyan-300/70 text-xs uppercase tracking-wider mb-1">Current encounter</p>
                                                    <div className={`${style.bg} border ${style.border} rounded-lg px-3 py-2`}>
                                                        <p className="text-cyan-200 text-xs font-semibold mb-0.5">{currentEnc.name}</p>
                                                        <p className={`${style.text} text-sm font-mono`}>{currentEnc.tiers[tier]}</p>
                                                    </div>
                                                </div>
                                            ) : (
                                                <p className="text-cyan-100/40 text-xs italic mb-3">{ENCOUNTER_SCALING.encounters.length === 0 ? 'Encounters added as slides are built' : 'Not a scaled encounter'}</p>
                                            )}
                                            {ENCOUNTER_SCALING.encounters.length > 0 && (
                                                <details className="group">
                                                    <summary className="text-cyan-300/60 text-xs cursor-pointer hover:text-cyan-300 select-none">All encounters ▸</summary>
                                                    <div className="mt-2 space-y-2">
                                                        {ENCOUNTER_SCALING.encounters.map(enc => (
                                                            <div key={enc.slideId} className="bg-slate-900/60 rounded-lg px-3 py-2">
                                                                <p className="text-cyan-200/80 text-xs font-semibold mb-0.5">{enc.name}</p>
                                                                <p className={`${style.text} text-xs font-mono`}>{enc.tiers[tier]}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </details>
                                            )}
                                        </div>
                                    );
                                })()}

                                {/* Adventure Structure */}
                                <div className="bg-slate-950/80 backdrop-blur border-2 border-indigo-600/50 rounded-lg p-4">
                                    <h3 className="text-xl font-bold text-indigo-300 mb-4 flex items-center gap-2 font-display">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
                                        </svg>
                                        Adventure Parts
                                    </h3>
                                    <div className="space-y-2">
                                        {CAMPAIGN_DATA.parts.map((p, i) => (
                                            <div key={i} className="p-2 rounded border-l-4 border-indigo-500 bg-indigo-950/30">
                                                <div className="flex items-start justify-between gap-2 mb-1">
                                                    <span className="text-indigo-300 font-semibold text-sm">{p.part}</span>
                                                    <span className="text-indigo-400/60 text-xs shrink-0 mt-0.5">{p.location}</span>
                                                </div>
                                                <p className="text-indigo-100/70 text-xs">{p.description}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Session Notes */}
                                <div className="bg-slate-950/80 backdrop-blur border-2 border-green-600/50 rounded-lg p-4">
                                    <h3 className="text-xl font-bold text-green-300 mb-4 flex items-center gap-2 font-display">
                                        <Icon d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
                                        Session Notes
                                    </h3>
                                    <div className="space-y-3">
                                        <div className="flex gap-2">
                                            <input type="text" value={noteText} onChange={e => setNoteText(e.target.value)}
                                                onKeyPress={e => e.key === 'Enter' && addNote()}
                                                placeholder="Key moment..."
                                                className="flex-1 px-3 py-2 bg-slate-900 border border-green-600/30 rounded text-green-100 text-sm placeholder-green-500/30"/>
                                            <button onClick={addNote} className="px-4 py-2 bg-green-700 hover:bg-green-600 rounded font-semibold text-sm">Add</button>
                                        </div>
                                        {notes.moments.length > 0 && (
                                            <div className="mt-2">
                                                <h4 className="text-green-300 font-semibold mb-2 text-sm">Moments:</h4>
                                                <ul className="space-y-1">
                                                    {notes.moments.map((m, i) => (
                                                        <li key={i} className="text-xs text-green-100/80">
                                                            <span className="text-green-400/60">[{m.time}]</span> {m.text}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.render(<DMCompanion />, document.getElementById('root'));
    </script>
</body>
</html>
